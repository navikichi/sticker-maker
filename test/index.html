<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f7fc;color:#2f3445;margin:0;padding:12px}
h1{font-size:20px;margin:4px 0 6px}
p{color:#7a8196;font-size:14px;margin:0 0 10px}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px}
.card img{width:80px;height:80px;background:#2f3445;border-radius:10px}
.card b{display:block;font-size:17px}
.card span{color:#7a8196;font-size:13px}
.card div{flex:1}
button{border:0;background:#7ea6e0;color:#fff;font-weight:700;font-size:15px;padding:11px 14px;border-radius:12px}
</style>
</head>
<body>
<h1>Messenger test</h1>
<p>Tap Share on each one, pick Messenger and send it to yourself. Then send me a screenshot of the chat.</p>
<div class="card"><img src="a-photo-512.png" alt=""><div><b>A</b><span>Like now (big PNG)</span></div><button data-f="a-photo-512.png">Share A</button></div>
<div class="card"><img src="b-small-160.png" alt=""><div><b>B</b><span>Small PNG</span></div><button data-f="b-small-160.png">Share B</button></div>
<div class="card"><img src="c-gif-512.gif" alt=""><div><b>C</b><span>Big GIF</span></div><button data-f="c-gif-512.gif">Share C</button></div>
<div class="card"><img src="d-small-gif-160.gif" alt=""><div><b>D</b><span>Small GIF</span></div><button data-f="d-small-gif-160.gif">Share D</button></div>
<script>
(function () {
  var files = {};
  Array.prototype.forEach.call(document.querySelectorAll('button'), function (b) {
    var name = b.getAttribute('data-f');
    var type = /\.gif$/.test(name) ? 'image/gif' : 'image/png';
    fetch(name).then(function (r) { return r.blob(); }).then(function (blob) {
      files[name] = new File([blob], name, { type: type });
    });
    b.addEventListener('click', function () {
      var f = files[name];
      if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f] }).catch(function () {});
      } else {
        alert('Sharing is not available here. Press and hold the picture to save it instead.');
      }
    });
  });
})();
</script>
</body>
</html>
